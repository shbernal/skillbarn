name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  package:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # publint packs with lifecycle scripts off, so dist/ has to be there first.
      - run: pnpm build
      - run: pnpm publint
      # This one packs for real, from a clean checkout, so it is what proves that
      # prepack builds dist/ and that the published bin runs.
      - name: the packed bin runs
        run: |
          rm -rf dist
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/skillbarn-*.tgz -C "$RUNNER_TEMP"
          node "$RUNNER_TEMP/package/dist/cli.js" --version
