name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  package:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # publint packs with lifecycle scripts off, so dist/ has to be there first.
      - run: pnpm build
      - run: pnpm publint
      # This one packs for real, from a clean checkout, so it is what proves that
      # prepack builds dist/ and that the published bin runs.
      - name: the packed bin runs
        run: |
          rm -rf dist
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/skillbarn-*.tgz -C "$RUNNER_TEMP"
          node "$RUNNER_TEMP/package/dist/cli.js" --version

  # The one job the ruleset requires (with commit-check), so the Node matrix can move
  # without touching the ruleset.
  ci-ok:
    if: always()
    needs: [test, lint, package]
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULTS" = success
        env:
          RESULTS: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) && 'failure' || 'success' }}

  commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: false
