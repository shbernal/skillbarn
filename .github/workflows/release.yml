name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build # publint packs with lifecycle scripts off
      - run: pnpm publint

      # npm rather than pnpm here: `npm publish` is what mints the provenance
      # attestation, and prepack builds dist/ either way.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
